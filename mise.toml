# Local CI and dev tasks. `mise run ci` runs everything CI would; `mise tasks` lists the rest.

[tools]
dotnet = "10"

[env]
DOTNET_NOLOGO = "1"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"

[tasks.restore]
description = "Restore NuGet packages"
run = "dotnet restore RadioBridge.slnx"

[tasks.build]
description = "Build the app, tools and tests (Debug)"
depends = ["restore"]
run = "dotnet build RadioBridge.slnx --no-restore"

[tasks.lint]
description = "Check formatting and code style (fails on any change dotnet format would make)"
depends = ["restore"]
run = "dotnet format RadioBridge.slnx --verify-no-changes --no-restore"

[tasks.format]
description = "Fix formatting and code style"
run = "dotnet format RadioBridge.slnx"

[tasks.test]
description = "Unit tests"
depends = ["build"]
run = "dotnet test tests/RadioBridge.Tests --no-build"

[tasks."test:ui"]
description = "Reader UI tests: the Markdown view and the readme/notices window, with real text layout and simulated clicks (no screen needed)"
depends = ["build"]
run = "dotnet test tests/RadioBridge.UiTests --no-build"

[tasks.notices]
description = "Regenerate THIRD-PARTY-NOTICES.md from the license texts in packaging/notices/sources (needs Windows PowerShell)"
depends = ["restore"]
run = "echo The notices tools need Windows PowerShell; nothing done."
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File packaging/notices/generate-third-party-notices.ps1"

[tasks."notices:check"]
description = "Fail if THIRD-PARTY-NOTICES.md is out of date, or a dependency has no license text (needs Windows PowerShell)"
depends = ["restore"]
run = "echo The notices check needs Windows PowerShell; skipped."
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File packaging/notices/generate-third-party-notices.ps1 -Check"

[tasks."test:hardware"]
description = "Hardware checks on a connected radio panel: shared access, startup state (blanks its displays briefly)"
depends = ["build"]
env = { RADIOBRIDGE_HARDWARE = "1" }
run = "dotnet test tests/RadioBridge.Tests --no-build --filter FullyQualifiedName~HardwareTests"

[tasks.functional]
description = "Functional tests: the real app driven through its automation API, against the X-Plane emulator"
depends = ["build"]
run = "dotnet test tests/RadioBridge.FunctionalTests --no-build"

[tasks."functional:xplane"]
description = "Functional tests against a running X-Plane 12 with a flight loaded (changes the aircraft's radios)"
depends = ["build"]
env = { RADIOBRIDGE_FT_SIM = "xplane" }
run = "dotnet test tests/RadioBridge.FunctionalTests --no-build"

[tasks."functional:msfs"]
description = "Functional tests against a running MSFS with a flight loaded (Windows; changes the aircraft's radios)"
depends = ["build"]
env = { RADIOBRIDGE_FT_SIM = "msfs" }
run = "dotnet test tests/RadioBridge.FunctionalTests --no-build"

[tasks.ci]
description = "Everything CI would run: lint, notices check, build, unit tests, UI tests, functional tests against the emulator"
run = [
  { task = "lint" },
  { task = "notices:check" },
  { task = "test" },
  { task = "test:ui" },
  { task = "functional" },
]

[tasks.run]
description = "Run RadioBridge"
run = "dotnet run --project src/RadioBridge.Desktop"

[tasks.emulator]
description = "Run the X-Plane emulator on port 8086, to try the app without X-Plane"
run = "dotnet run --project tests/RadioBridge.FakeXPlane -- --port 8086"

[tasks.package]
description = "Single-file, self-contained executables for Windows, Linux and macOS into ./dist"
run = [
  "dotnet publish src/RadioBridge.Desktop -c Release -r win-x64 -p:SingleFile=true -o dist/win-x64",
  "dotnet publish src/RadioBridge.Desktop -c Release -r linux-x64 -p:SingleFile=true -o dist/linux-x64",
  "dotnet publish src/RadioBridge.Desktop -c Release -r osx-arm64 -p:SingleFile=true -o dist/osx-arm64",
  "dotnet publish src/RadioBridge.Desktop -c Release -r osx-x64 -p:SingleFile=true -o dist/osx-x64",
]

[tasks."package:windows"]
description = "Windows release zip (RadioBridge-<version>-win-x64.zip in ./dist) from a clean checkout"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/make-release-zip.ps1"

[tasks."functional:package"]
description = "Package for this machine, then run the functional tests against that single file"
run = [
  "dotnet publish src/RadioBridge.Desktop -c Release --use-current-runtime -p:SingleFile=true -o dist/current",
  "dotnet build tests/RadioBridge.FunctionalTests",
  "dotnet test tests/RadioBridge.FunctionalTests --no-build",
]
env = { RADIOBRIDGE_APP = "dist/current" }
